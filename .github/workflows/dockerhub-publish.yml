name: Publish devcontainer image to Docker Hub

# Builds + pushes the operator-facing devcontainer image
# (.devcontainer/Dockerfile) to Docker Hub so users can `docker pull`
# instead of building ~6GB locally. See gadievron/raptor#191.
#
# Tags pushed:
#   :latest      — moving tag, updated on every push to main that touches
#                  the Dockerfile (mirrors ci-deps-image.yml's pattern).
#   :<version>   — pushed only on tagged releases (vX.Y.Z -> X.Y.Z).
#
# Uses the plain `docker` CLI rather than docker/* marketplace actions,
# to keep the third-party action surface to just actions/checkout
# (pinned to the same SHA the rest of the repo uses).

on:
  push:
    branches: [ main ]
    paths:
      - '.devcontainer/Dockerfile'
      # The Dockerfile COPYs and installs these, but they were not triggers,
      # so a dependency-only change never rebuilt the published image. The
      # pyproject/uv.lock entries are for the uv migration; the requirements
      # entries stay until those files are actually deleted.
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'packages/web/requirements.txt'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.devcontainer/test_devcontainer.py'
      - '.github/workflows/dockerhub-publish.yml'
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-push:
    if: github.repository == 'gadievron/raptor'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # was v7.0.0
        with:
          persist-credentials: false

      - name: Determine image tags
        id: tags
        run: |
          set -euo pipefail
          image="danielcuthbert/raptor"
          if [[ "${GITHUB_REF}" == refs/tags/v*.*.* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
            echo "tags=${image}:${version}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${image}:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Docker Hub
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin

      - name: Build
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          set -euo pipefail
          build_args=()
          for tag in ${TAGS//,/ }; do
            build_args+=(-t "${tag}")
          done
          docker build -f .devcontainer/Dockerfile "${build_args[@]}" .

      # Gate the push on the 878-line dependency verifier, which until now
      # was run by no workflow at all — the image could ship with a missing
      # or downgraded dependency and nothing would notice.
      #
      # The bind mount is load-bearing, not a convenience. The Dockerfile
      # COPYs only the requirements files (to /tmp) and leaves
      # WORKDIR /workspaces/raptor empty; the repo normally arrives via the
      # devcontainer's workspace mount at runtime. Without the mount the
      # script is not in the image to run, and the PYTHONPATH set at
      # .devcontainer/Dockerfile:161 (/workspaces/raptor:.../packages) points
      # at nothing, so every `import core.*` check fails. Mounting the
      # checkout there reproduces the contract the script documents
      # ("Run this inside the devcontainer").
      - name: Verify image dependencies
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          set -euo pipefail
          first_tag="${TAGS%%,*}"
          docker run --rm \
            -v "$PWD:/workspaces/raptor" -w /workspaces/raptor \
            "${first_tag}" python .devcontainer/test_devcontainer.py

      - name: Push
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          set -euo pipefail
          for tag in ${TAGS//,/ }; do
            docker push "${tag}"
          done

